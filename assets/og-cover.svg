<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="CV STEM Guide — Free STEM opportunities for Central Valley students">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c2238"/>
      <stop offset="0.55" stop-color="#14507a"/>
      <stop offset="1" stop-color="#b8892a"/>
    </linearGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Logo badge -->
  <g transform="translate(96,96)">
    <rect width="104" height="104" rx="26" fill="#1a6fa8"/>
    <text x="52" y="74" text-anchor="middle" font-size="58" font-weight="700" fill="#f0c96a" font-family="Georgia, serif">CV</text>
  </g>
  <text x="228" y="168" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff" letter-spacing="-0.5">Central Valley STEM Guide</text>

  <!-- Headline -->
  <text x="96" y="330" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="78" font-weight="700" fill="#ffffff" letter-spacing="-1.5">Your future in STEM</text>
  <text x="96" y="420" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="78" font-weight="700" letter-spacing="-1.5">
    <tspan fill="#ffffff">starts </tspan><tspan fill="#f0c96a" font-style="italic">right here.</tspan>
  </text>

  <!-- Subhead -->
  <text x="98" y="486" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="30" font-weight="500" fill="#dfe9f3">Free programs, scholarships &amp; competitions — every engineering discipline.</text>

  <!-- Chips -->
  <g font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="24" font-weight="700">
    <g transform="translate(96,536)">
      <rect width="232" height="58" rx="29" fill="#ffffff" opacity="0.12"/>
      <text x="116" y="38" text-anchor="middle" fill="#ffffff">18 counties</text>
    </g>
    <g transform="translate(344,536)">
      <rect width="232" height="58" rx="29" fill="#ffffff" opacity="0.12"/>
      <text x="116" y="38" text-anchor="middle" fill="#ffffff">No sign-up</text>
    </g>
    <g transform="translate(592,536)">
      <rect width="232" height="58" rx="29" fill="#ffffff" opacity="0.12"/>
      <text x="116" y="38" text-anchor="middle" fill="#ffffff">100% free</text>
    </g>
  </g>

  <text x="1104" y="586" text-anchor="end" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="26" font-weight="700" fill="#f0c96a">cvstemguide.com</text>
</svg>
